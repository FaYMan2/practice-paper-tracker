name: CI

on:
  pull_request:
  push:
    branches: [main]

# Fork PRs get a read-only token by default; nothing here needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # `postinstall` runs `wxt prepare`, which generates the types the
      # typecheck needs, so this has to come first.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm compile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
