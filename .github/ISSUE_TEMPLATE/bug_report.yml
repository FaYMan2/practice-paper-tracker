name: Bug report
description: Something is tracked wrongly, or not at all
title: "[Bug] "
labels: ["bug"]
assignees: ["FaYMan2"]

body:
  - type: markdown
    attributes:
      value: >
        If the toolbar icon shows a `!`, the site's markup has probably changed.
        Say so here — that is the most useful bug we can get.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      validations:
        required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://practicepaper.in/gate-cse/stack?page_no=3
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: >
        Anything prefixed `[pptr]` from the page console, and from the service
        worker console at chrome://extensions.
      render: text
    validations:
      required: false

  - type: input
    id: chrome
    attributes:
      label: Chrome version
    validations:
      required: false
