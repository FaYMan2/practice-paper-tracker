<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#232120" media="(prefers-color-scheme: dark)" />
    <title>PracticePaper Tracker</title>
    <script>
      /*
       * Resolves the theme before first paint.
       *
       * Inline and blocking on purpose: a stored preference applied from React
       * would land after the first frame, so opening the dashboard at night
       * would flash a white page. Writing the resolved value onto <html> also
       * lets the stylesheet carry one dark block instead of duplicating the
       * palette under prefers-color-scheme.
       */
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("pptr-theme");
        } catch (error) {
          /* Storage can be blocked; the system preference still works. */
        }
        var dark =
          stored === "dark" ||
          (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
